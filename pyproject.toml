[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starloader"
version = "0.3.0"
description = "Load CSV extracts into a SQLite star schema with SCD2 dimensions and incremental facts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
starloader = "starloader.cli:main"

[tool.setuptools]
packages = ["starloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
